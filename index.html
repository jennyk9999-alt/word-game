<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>초등 영어 단어 게임 · Lesson 7~8</title>

<style>
  /* 크레파스 색.
     따뜻한 색(주황·노랑) 위엔 어두운 글자(--on-warm), 진한 색(파랑·초록·빨강) 위엔 흰 글자(--on-cool). */
  :root {
    --paper:      #FFFBF2;
    --card:       #FFFFFF;
    --ink:        #2A2340;
    --ink-soft:   #6B6280;
    --line:       #2A2340;
    --orange:     #FF7A18;
    --blue:       #2F6BF0;
    --yellow:     #FFC53D;
    --rose:       #FFC53D;
    --green:      #159C63;
    --red:        #E23D2E;
    --on-warm:    #241A00;
    --on-cool:    #FFFFFF;
    --shadow:     #2A2340;
    --tab-off:    #F0E7D8;
    --slot:       #FFF1DC;
    --word:       #101014;
    --radius:     18px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:     #1E1A2B;
      --card:      #2A2440;
      --ink:       #FFF6E8;
      --ink-soft:  #B4A9C9;
      --line:      #0F0C19;
      --orange:    #FF8C3A;
      --blue:      #5B8BF5;
      --yellow:    #FFC53D;
      --rose:      #FFC53D;
      --green:     #29C583;
      --red:       #FF6B5A;
      --on-warm:   #241A00;
      --on-cool:   #14121D;
      --shadow:    #0F0C19;
      --tab-off:   #37304F;
      --slot:      #3A3257;
      --word:      #FFF6E8;
    }
  }
  :root[data-theme="dark"] {
    --paper:     #1E1A2B;
    --card:      #2A2440;
    --ink:       #FFF6E8;
    --ink-soft:  #B4A9C9;
    --line:      #0F0C19;
    --orange:    #FF8C3A;
    --blue:      #5B8BF5;
    --yellow:    #FFC53D;
    --rose:      #FFC53D;
    --green:     #29C583;
    --red:       #FF6B5A;
    --on-warm:   #241A00;
    --on-cool:   #14121D;
    --shadow:    #0F0C19;
    --tab-off:   #37304F;
    --slot:      #3A3257;
    --word:      #FFF6E8;
  }
  :root[data-theme="light"] {
    --paper:      #FFFBF2;
    --card:       #FFFFFF;
    --ink:        #2A2340;
    --ink-soft:   #6B6280;
    --line:       #2A2340;
    --orange:     #FF7A18;
    --blue:       #2F6BF0;
    --yellow:     #FFC53D;
    --rose:       #FFC53D;
    --green:      #159C63;
    --red:        #E23D2E;
    --on-warm:    #241A00;
    --on-cool:    #FFFFFF;
    --shadow:     #2A2340;
    --tab-off:    #F0E7D8;
    --slot:       #FFF1DC;
    --word:       #101014;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: 19px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 64px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .count {
    display: inline-block;
    min-width: 1.9em;
    margin-left: 6px;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--card);
    border: 2px solid var(--line);
    color: var(--ink);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }

  /* ---- 상태 띠 ---- */
  .status {
    border: 3px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: 4px 4px 0 var(--shadow);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .coin-label { font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 16px;
    font-weight: 700;
    padding: 4px 12px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--slot);
    font-variant-numeric: tabular-nums;
  }

  .bar {
    height: 22px;
    border: 3px solid var(--line);
    border-radius: 999px;
    background: var(--slot);
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    background: repeating-linear-gradient(45deg, var(--yellow) 0 12px, var(--orange) 12px 24px);
    transition: width .35s ease;
  }

  /* ---- 문제 ---- */
  .panel {
    border: 3px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: 6px 6px 0 var(--shadow);
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .kicker {
    align-self: flex-start;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 4px 12px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--blue);
    color: var(--on-warm);
  }
  .kicker.cloze { background: var(--green); }

  .prompt-word {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    font-size: clamp(54px, 15vw, 88px);
    font-weight: 900;
    letter-spacing: -0.02em;
    text-align: center;
    text-wrap: balance;
    margin: 6px 0 0;
    color: var(--word);
  }
  .prompt-sub { text-align: center; font-size: 17px; font-weight: 800; color: var(--ink-soft); margin: 0; }

  .sentence {
    font-size: clamp(26px, 6.5vw, 36px);
    font-weight: 800;
    text-align: center;
    text-wrap: balance;
    margin: 0;
    line-height: 1.45;
  }
  .blank {
    display: inline-block;
    min-width: 3.2em;
    border-bottom: 6px solid var(--orange);
    vertical-align: -2px;
  }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 460px) { .choices { grid-template-columns: 1fr; } }

  .choice {
    font: inherit;
    font-size: 17px;
    font-weight: 800;
    min-height: 48px;
    padding: 8px;
    border: 3px solid var(--line);
    border-radius: 14px;
    background: var(--slot);
    color: var(--word);
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--shadow);
    transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
    text-wrap: balance;
  }
  .choice:hover:not(:disabled) { background: var(--yellow); }
  .choice:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow); }
  .choice:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
  .choice.right { background: var(--green); color: var(--on-cool); }
  .choice.wrong { background: var(--red); color: var(--on-cool); }
  .choice:disabled { cursor: default; }

  /* ---- 빈칸 타이핑 ---- */
  .fill-wrap { display: flex; gap: 10px; flex-wrap: wrap; }
  .fill-input {
    font: inherit;
    flex: 1 1 160px;
    font-size: 22px;
    font-weight: 800;
    min-height: 48px;
    padding: 8px 14px;
    border: 3px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: var(--word);
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .fill-input::placeholder { color: var(--ink-soft); font-weight: 600; }
  .fill-input:focus-visible { outline: 4px solid var(--blue); outline-offset: 2px; }
  .fill-input.right { background: var(--green); color: var(--on-cool); }
  .fill-input.wrong { background: var(--red); color: var(--on-cool); }
  .fill-input:disabled { opacity: .9; }

  .fill-submit {
    font: inherit;
    flex: 0 0 auto;
    font-size: 19px;
    font-weight: 900;
    min-height: 48px;
    padding: 8px 20px;
    border: 3px solid var(--line);
    border-radius: 14px;
    background: var(--blue);
    color: var(--on-cool);
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--shadow);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .fill-submit:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow); }
  .fill-submit:focus-visible { outline: 4px solid var(--orange); outline-offset: 3px; }
  .fill-submit:disabled { opacity: .5; cursor: default; }

  /* ---- 철자 타이핑 연습 ---- */
  .spell-box { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .spell-ask { margin: 0; font-size: 17px; font-weight: 800; color: var(--ink-soft); }
  .spell-letters {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    cursor: text;
  }
  .spell-slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 44px;
    border: 3px solid var(--line);
    border-bottom-width: 6px;
    border-radius: 8px;
    background: var(--slot);
    font-size: 21px;
    font-weight: 900;
    color: var(--word);
  }
  .spell-slot.filled { background: var(--card); }
  .spell-slot.active { outline: 3px solid var(--blue); outline-offset: 2px; }
  .spell-slot.wrong { background: var(--red); color: var(--on-cool); animation: spell-shake .3s ease; }
  .spell-slot.done { background: var(--green); color: var(--on-cool); border-bottom-width: 3px; }
  .spell-gap { width: 14px; }
  @keyframes spell-shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* 글자 칸들 위에 그대로 겹치는 투명 입력창 — 어디를 눌러도 바로 키보드가 뜨게 (모바일 대응) */
  .spell-hidden-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 0;
    margin: 0;
    border: 0;
    background: transparent;
    opacity: 0;
    font-size: 16px;
    cursor: text;
  }

  .verdict {
    border: 3px dashed var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 19px;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .verdict.ok { background: color-mix(in srgb, var(--green) 18%, transparent); }
  .verdict.no { background: color-mix(in srgb, var(--red) 16%, transparent); }
  .verdict small { font-size: 16px; font-weight: 600; color: var(--ink-soft); }

  .big-btn {
    font: inherit;
    font-size: 22px;
    font-weight: 900;
    padding: 16px;
    border: 3px solid var(--line);
    border-radius: 14px;
    background: var(--orange);
    color: var(--on-warm);
    cursor: pointer;
    box-shadow: 5px 5px 0 var(--shadow);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .big-btn:active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--shadow); }
  .big-btn:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
  .big-btn.blue { background: var(--blue); color: var(--on-cool); }
  .big-btn.ghost {
    background: var(--card);
    color: var(--ink);
    font-size: 18px;
    font-weight: 800;
    box-shadow: 3px 3px 0 var(--shadow);
    padding: 12px 14px;
  }

  /* ---- 단어장 ---- */
  .word-list { display: flex; flex-direction: column; gap: 12px; }
  .word-item {
    border: 3px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    box-shadow: 4px 4px 0 var(--shadow);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .word-head { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .word-en {
    font-size: clamp(54px, 15vw, 88px);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.05;
    color: var(--word);
    text-wrap: balance;
  }
  .word-ko { font-size: 21px; font-weight: 800; text-align: center; }
  .word-no {
    font-size: clamp(28px, 8vw, 46px);
    margin-right: 10px;
    font-weight: 800;
    color: var(--word);
    font-variant-numeric: tabular-nums;
  }
  .word-sent { font-size: 17px; color: var(--ink-soft); }
  .miss {
    font-size: 15px;
    font-weight: 700;
    padding: 2px 10px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--slot);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ---- 발음 버튼 ---- */
  .say {
    font: inherit;
    font-size: 26px;
    line-height: 1;
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border: 3px solid var(--line);
    border-radius: 50%;
    background: var(--yellow);
    color: var(--on-warm);
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--shadow);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .say:hover { background: var(--rose); }
  .say:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }
  .say:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
  .say.small { width: 42px; height: 42px; font-size: 19px; box-shadow: 2px 2px 0 var(--shadow); }

  .say-row { display: flex; justify-content: center; align-items: center; gap: 10px; }
  .say-row.left { justify-content: flex-start; margin-top: 6px; }
  .say-label { font-size: 16px; font-weight: 700; color: var(--ink-soft); }

  .word-en-wrap { display: flex; align-items: center; gap: 10px; }
  .drill-line { display: flex; align-items: center; gap: 10px; }
  .drill-line .drill-full { flex: 1 1 auto; }
  .q-line { display: flex; align-items: center; gap: 8px; }
  .q-line .q-row { flex: 1 1 auto; }

  /* ---- 단어별 뜻 맞히기 ---- */
  .mini-quiz { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .mini-ask { margin: 0; font-size: 17px; font-weight: 800; color: var(--ink-soft); }
  .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .mini-choice {
    font: inherit;
    font-size: 17px;
    font-weight: 800;
    min-height: 48px;
    padding: 8px;
    border: 3px solid var(--line);
    border-radius: 12px;
    background: var(--slot);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .mini-choice:hover:not(:disabled) { background: var(--yellow); }
  .mini-choice:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }
  .mini-choice:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
  .mini-choice.right { background: var(--green); color: var(--on-cool); }
  .mini-choice.wrong { background: var(--red); color: var(--on-cool); }
  .mini-choice:disabled { cursor: default; }

  /* ---- 예문 안의 작은 탭 ---- */
  .mini-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .mini-tab {
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    padding: 9px 4px;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .mini-tab[aria-pressed="true"] { background: var(--orange); color: var(--on-warm); }
  .mini-tab:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  .pane { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }

  /* ---- 단계 (점점 사라지는 문장) ---- */
  .stage-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .stage-btn {
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    padding: 6px 12px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .stage-btn[aria-pressed="true"] { background: var(--blue); color: var(--on-cool); }
  .stage-btn:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .stage-tip { margin: 0; font-size: 14px; font-weight: 700; color: var(--ink-soft); }

  /* ---- 문장 만들기 ---- */
  .order-wrap { display: flex; flex-direction: column; gap: 10px; }
  .order-made {
    margin: 0;
    min-height: 56px;
    padding: 12px 14px;
    border: 3px dashed var(--line);
    border-radius: 12px;
    background: var(--card);
    font-size: 21px;
    font-weight: 800;
    line-height: 1.4;
  }
  .order-made.empty { color: var(--ink-soft); font-weight: 600; font-size: 17px; }
  .order-bank { display: flex; flex-wrap: wrap; gap: 8px; }
  .order-chip {
    font: inherit;
    font-size: 19px;
    font-weight: 800;
    padding: 10px 14px;
    border: 3px solid var(--line);
    border-radius: 12px;
    background: var(--yellow);
    color: var(--on-warm);
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .order-chip:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }
  .order-chip:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

  /* ---- 오늘의 목표 ---- */
  .bar-note { font-size: 15px; font-weight: 700; color: var(--ink-soft); }
  .chip.fire { background: var(--rose); color: var(--on-warm); }
  .goal-done {
    padding: 10px 12px;
    border: 3px solid var(--line);
    border-radius: 12px;
    background: var(--green);
    color: var(--on-cool);
    font-size: 18px;
    font-weight: 900;
    text-align: center;
  }

  /* ---- 녹음 ---- */
  .rec-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 0 2px;
  }
  .rec-btn {
    font: inherit;
    font-size: 17px;
    font-weight: 800;
    padding: 9px 14px;
    border: 3px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .rec-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }
  .rec-btn:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
  .rec-btn:disabled { opacity: .45; cursor: default; box-shadow: 2px 2px 0 var(--shadow); }
  .rec-btn.on { background: var(--red); color: var(--on-cool); animation: blink 1s ease-in-out infinite; }
  .rec-btn.play:not(:disabled) { background: var(--green); color: var(--on-cool); }
  .rec-msg { font-size: 15px; font-weight: 700; color: var(--ink-soft); }
  .rec-msg.good { color: var(--green); }
  .rec-msg.soso { color: var(--orange); }
  .rec-btn.listen:not(.on) { background: var(--blue); color: var(--on-cool); }
  .rec-btn.listen.on { background: var(--red); color: var(--on-cool); animation: blink 1s ease-in-out infinite; }

  @keyframes blink { 50% { opacity: .55; } }

  .seg { display: flex; gap: 8px; margin-top: 4px; }
  .seg-btn {
    font: inherit;
    flex: 1;
    font-size: 18px;
    font-weight: 800;
    padding: 11px 8px;
    border: 3px solid var(--line);
    border-radius: 12px;
    background: var(--tab-off);
    color: var(--ink);
    cursor: pointer;
  }
  .seg-btn[aria-pressed="true"] { background: var(--blue); color: var(--on-cool); }
  .seg-btn:focus-visible { outline: 4px solid var(--orange); outline-offset: 3px; }

  /* 단어 찾기 — 화면 맨 위에 한 덩어리로 */
  .search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 6px 16px;
    border: 3px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    box-shadow: 5px 5px 0 var(--shadow);
  }
  .search-bar:focus-within { outline: 4px solid var(--blue); outline-offset: 3px; }
  .search-icon { font-size: 24px; line-height: 1; flex: none; }
  .search-input {
    font: inherit;
    flex: 1 1 auto;
    min-width: 0;
    font-size: 20px;
    font-weight: 800;
    min-height: 48px;
    padding: 4px 0;
    border: none;
    background: transparent;
    color: var(--word);
  }
  .search-input:focus { outline: none; }
  .search-input::placeholder { color: var(--ink-soft); font-weight: 600; font-size: 17px; }
  .search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search-clear {
    font: inherit;
    font-size: 19px;
    font-weight: 800;
    min-width: 48px;
    min-height: 48px;
    border: 3px solid var(--line);
    border-radius: 12px;
    background: var(--tab-off);
    color: var(--ink);
    cursor: pointer;
    flex: none;
  }
  .search-clear:focus-visible { outline: 4px solid var(--orange); outline-offset: 3px; }
  .search-msg { font-weight: 700; }

      asked: 0, correct: 0, qNo: 0,
      daily: { date: today(), done: 0, goal: 10 },
      streak: { count: 0, last: "" }
    };
  }
  var S = blank();

  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) { S = normalize(JSON.parse(raw)); }
    } catch (e) { S = blank(); }
  }
  function normalize(o) {
    var b = blank();
    if (!o || typeof o !== "object") { return b; }
    b.asked   = Math.max(0, parseInt(o.asked, 10) || 0);
    b.correct = Math.max(0, parseInt(o.correct, 10) || 0);
    b.qNo     = Math.max(0, parseInt(o.qNo, 10) || 0);
    if (o.wrong && typeof o.wrong === "object") {
      Object.keys(o.wrong).forEach(function (en) {
        if (findWord(en)) { b.wrong[en] = Math.max(1, parseInt(o.wrong[en], 10) || 1); }
      });
    }
    if (o.levels && typeof o.levels === "object") {
      Object.keys(o.levels).forEach(function (en) {
        if (!findWord(en)) { return; }
        var lv = parseInt(o.levels[en], 10) || 1;
        b.levels[en] = Math.min(MAX_LEVEL, Math.max(1, lv));
      });
    }
    if (o.due && typeof o.due === "object") {
      Object.keys(o.due).forEach(function (en) {
        if (findWord(en)) { b.due[en] = Math.max(0, parseInt(o.due[en], 10) || 0); }
      });
    }
    if (o.daily && typeof o.daily === "object") {
      b.daily.date = String(o.daily.date || today());
      b.daily.done = Math.max(0, parseInt(o.daily.done, 10) || 0);
      b.daily.goal = Math.max(1, parseInt(o.daily.goal, 10) || 10);
    }
    if (o.streak && typeof o.streak === "object") {
      b.streak.count = Math.max(0, parseInt(o.streak.count, 10) || 0);
      b.streak.last = String(o.streak.last || "");
    }
    rollDay(b);
    return b;
  }

  // 날짜가 바뀌면 오늘 기록을 새로 시작한다. 연속 일수는 어제까지 이어졌을 때만 유지된다.
  function rollDay(st) {
    var t = today();
    if (st.daily.date === t) { return; }
    st.daily.date = t;
    st.daily.done = 0;
    if (st.streak.last && st.streak.last !== t && st.streak.last !== yesterdayOf(t)) {
      st.streak.count = 0;   // 하루라도 건너뛰면 처음부터
    }
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 저장 못 해도 게임은 계속 */ }
  }
  function findWord(en) {
    for (var i = 0; i < WORDS.length; i++) { if (WORDS[i].en === en) { return WORDS[i]; } }
    return null;
  }

  /* ---------- 도우미 ---------- */
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 발음 ---------- */
  // 브라우저에 들어 있는 음성 기능을 쓴다. 받아올 파일이 없어서 태블릿에서도 그대로 된다.
  var synth = window.speechSynthesis || null;
  var enVoice = null;

  // 목소리 후보에 점수를 매긴다. 요즘 브라우저는 같은 en-US 안에도
  // "Online (Natural)" 같은 자연스러운 신경망 음성과 옛날식 딱딱한 음성이 섞여 있다.
  function voiceScore(v) {
    var name = (v.name || "").toLowerCase();
    var lang = (v.lang || "").replace("_", "-").toLowerCase();
    var score = 0;

    if (lang === "en-us") { score += 100; }
    else if (lang === "en-gb") { score += 80; }
    else if (lang.indexOf("en") === 0) { score += 50; }
    else { return -1; }   // 영어가 아니면 후보에서 뺀다

    if (name.indexOf("online (natural)") !== -1 || name.indexOf("neural") !== -1) { score += 500; }
    else if (name.indexOf("natural") !== -1) { score += 300; }
    else if (name.indexOf("google") !== -1) { score += 200; }
    else if (name.indexOf("premium") !== -1 || name.indexOf("enhanced") !== -1) { score += 150; }

    if (name.indexOf("desktop") !== -1) { score -= 80; }  // 옛날식 SAPI 음성은 뒤로

    return score;
  }

  function pickVoice() {
    if (!synth || !synth.getVoices) { return; }
    var voices = synth.getVoices() || [];
    var best = null, bestScore = -1;
    for (var i = 0; i < voices.length; i++) {
      var sc = voiceScore(voices[i]);
      if (sc > bestScore) { bestScore = sc; best = voices[i]; }
    }
    if (best) { enVoice = best; }
  }
  if (synth) {
    pickVoice();
    // 목소리 목록은 늦게 도착하는 브라우저가 많다
    if (typeof synth.addEventListener === "function") {
      synth.addEventListener("voiceschanged", pickVoice);
    } else {
      synth.onvoiceschanged = pickVoice;
    }
  }

  function speak(text) {
    if (!synth || !window.SpeechSynthesisUtterance) { return; }
    try {
      synth.cancel(); // 앞의 말이 남아 있으면 끊고 새로 읽는다
      var u = new window.SpeechSynthesisUtterance(text);
      u.lang = enVoice ? enVoice.lang : "en-US";
      u.rate = 0.92;  // 너무 느리면 오히려 부자연스럽게 들려서 자연스러운 속도에 가깝게
      u.pitch = 1;
      if (enVoice) { u.voice = enVoice; }
      synth.speak(u);
    } catch (e) { /* 음성이 안 되는 기기에서도 게임은 계속 */ }
  }

  var canSpeak = !!(synth && window.SpeechSynthesisUtterance);

  /* ---------- 내 목소리 녹음 ---------- */
  var canRecord = !!(window.navigator && window.navigator.mediaDevices &&
                     window.navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  var activeRec = null; // 한 번에 하나만 녹음한다

  // 예문 하나에 붙는 녹음기: [🎤 녹음] 과 [▶️ 내 목소리]
  function makeRecorder(what) {
    if (!canRecord) { return null; }

    var wrap = document.createElement("div");
    wrap.className = "rec-wrap";

    var micBtn = document.createElement("button");
    micBtn.type = "button";
    micBtn.className = "rec-btn";
    micBtn.textContent = "🎤 녹음";
    micBtn.setAttribute("aria-label", what + " 따라 읽고 녹음하기");

    var playBtn = document.createElement("button");
    playBtn.type = "button";
    playBtn.className = "rec-btn play";
    playBtn.textContent = "▶️ 내 목소리";
    playBtn.disabled = true;

    var msg = document.createElement("span");
    msg.className = "rec-msg";

    var url = null;
    var recorder = null;
    var chunks = [];

    function stopRecording() {
      if (recorder && recorder.state !== "inactive") { recorder.stop(); }
    }

    function finish(stream) {
      if (stream && stream.getTracks) {
        stream.getTracks().forEach(function (t) { t.stop(); });
      }
      micBtn.textContent = "🎤 다시 녹음";
      micBtn.classList.remove("on");
      if (activeRec === stopRecording) { activeRec = null; }
    }

    micBtn.addEventListener("click", function () {
      if (recorder && recorder.state === "recording") { stopRecording(); return; }

      // 다른 곳에서 녹음 중이면 먼저 멈춘다
      if (activeRec) { activeRec(); }
      msg.textContent = "";

      window.navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        chunks = [];
        try { recorder = new window.MediaRecorder(stream); }
        catch (e) { msg.textContent = "이 기기에서는 녹음이 안 돼요."; finish(stream); return; }

        recorder.ondataavailable = function (ev) {
          if (ev.data && ev.data.size) { chunks.push(ev.data); }
        };
        recorder.onstop = function () {
          finish(stream);
          if (!chunks.length) { msg.textContent = "소리가 안 들어갔어요. 다시 해 볼까요?"; return; }
          if (url && window.URL && window.URL.revokeObjectURL) { window.URL.revokeObjectURL(url); }
          url = window.URL.createObjectURL(new Blob(chunks));
          playBtn.disabled = false;
          msg.textContent = "녹음 끝! 눌러서 들어 보세요";
        };

        recorder.start();
        activeRec = stopRecording;
        micBtn.textContent = "⏹ 그만";
        micBtn.classList.add("on");
        msg.textContent = "녹음 중… 따라 읽어 보세요";
      }).catch(function (err) {
        var name = err && err.name;
        if (name === "NotAllowedError" || name === "SecurityError") {
          msg.textContent = "마이크를 못 써요. 마이크 사용을 허용해 주세요.";
        } else if (name === "NotFoundError") {
          msg.textContent = "마이크가 없어요.";
        } else {
          msg.textContent = "녹음을 시작하지 못했어요.";
        }
      });
    });

    playBtn.addEventListener("click", function () {
      if (!url) { return; }
      if (synth) { synth.cancel(); }
      var audio = new window.Audio(url);
      audio.play();
    });

    wrap.appendChild(micBtn);
    wrap.appendChild(playBtn);
    wrap.appendChild(msg);
    return wrap;
  }

  // 누르면 읽어 주는 버튼. 음성이 없는 기기에서는 아예 만들지 않는다.
  function sayButton(text, size) {
    if (!canSpeak) { return null; }
    var b = document.createElement("button");
    b.type = "button";
    b.className = "say" + (size === "small" ? " small" : "");
    b.textContent = "🔊";
    b.setAttribute("aria-label", text + " 발음 듣기");
    b.title = "발음 듣기";
    b.addEventListener("click", function (ev) {
      if (ev && ev.stopPropagation) { ev.stopPropagation(); }
      speak(text);
    });
    return b;
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  /* ---------- 문제 만들기 ---------- */
  var current = null;
  var lastEn = null;

  // 간격 반복: 덜 외운 단어(단계가 낮은 단어)가 먼저·자주 돌아온다.
  // 맞히면 단계가 올라가서 한참 뒤에 나오고, 틀리면 1단계로 떨어져 바로 다시 나온다.
  function levelOf(en) { return S.levels[en] || 1; }
  function lessonOrderOf(w) { return w.lessonOrder || 1; }

  // 새 레슨은 그 앞 레슨들을 한 번씩 다 맞혀야 문제에 섞여 나온다
  // (제니 지시 8/20: 레슨 7 내용이 먼저 나오고, 다 익힌 뒤에 레슨 8이 섞이길 원함).
  function unlockedOrder() {
    var unlocked = 1;
    for (var order = 2; ; order++) {
      var prev = WORDS.filter(function (w) { return lessonOrderOf(w) < order; });
      if (!prev.length) { break; }
      var allLearned = prev.every(function (w) { return levelOf(w.en) >= 2; });
      if (!allLearned) { break; }
      unlocked = order;
    }
    return unlocked;
  }

  function nextQuestion() {
    var unlocked = unlockedOrder();
    var poolBase = WORDS.filter(function (w) { return lessonOrderOf(w) <= unlocked; });
    var ready = poolBase.filter(function (w) { return (S.due[w.en] || 0) <= S.qNo; });
    var pool = ready.length ? ready : poolBase;

    // 나올 때가 된 것들 중에서도 단계가 낮은 쪽을 먼저 (덜 외운 단어에 시간을 더 쓴다)
    if (pool.length > 1) {
      var lowest = Math.min.apply(null, pool.map(function (w) { return levelOf(w.en); }));
      var weak = pool.filter(function (w) { return levelOf(w.en) <= lowest + 1; });
      if (weak.length) { pool = weak; }
    }

    var word = pick(pool);
    var guard = 0;
    while (word.en === lastEn && pool.length > 1 && guard++ < 12) { word = pick(pool); }
    lastEn = word.en;

    // 홀짝으로 번갈아 → 정확히 절반씩
    var type = (S.qNo % 2 === 0) ? "meaning" : "cloze";

    var sameCat = poolBase.filter(function (w) { return w.cat === word.cat && w.en !== word.en; });
    var others = shuffle(sameCat.slice()).slice(0, 3);
    while (others.length < 3) {
      var extra = pick(poolBase);
      if (extra.en !== word.en && others.indexOf(extra) === -1) { others.push(extra); }
    }
    current = { word: word, type: type, options: shuffle(others.concat([word])) };
    renderQuestion();
  }

  function renderQuestion() {
    var w = current.word;
    var kicker = $("q-kicker");
    var body = $("q-body");
    var choices = $("q-choices");

    $("q-verdict").innerHTML = "";
    $("q-drills").innerHTML = "";
    $("btn-next").classList.add("hidden");
    body.innerHTML = "";
    choices.innerHTML = "";

    // 문제 유형 이름 대신 단원 이름을 띄운다 (제니 지시 8/3).
    // 유형은 harness 와 코드에서 data-qtype 으로 구분한다.
    body.setAttribute("data-qtype", current.type);

    if (current.type === "meaning") {
      kicker.textContent = w.lesson || LESSON;
      kicker.className = "kicker";
      var big = document.createElement("p");
      big.className = "prompt-word";
      var bigNo = document.createElement("span");
      bigNo.className = "word-no big";
      bigNo.textContent = "1.";
      big.appendChild(bigNo);
      var bigEn = document.createElement("span");
      bigEn.className = "prompt-en";
      bigEn.textContent = w.en;
      big.appendChild(bigEn);
      var sub = document.createElement("p");
      sub.className = "prompt-sub";
      sub.textContent = "무슨 뜻일까?";
      // 아래 목록과 같은 모양: 번호 · 단어 · 스피커가 한 줄에 나란히
      var say = sayButton(w.en);
      if (say) { big.appendChild(say); }
      body.appendChild(big);
      body.appendChild(sub);
    } else {
      kicker.textContent = w.lesson || LESSON;
      kicker.className = "kicker cloze";
      var p = document.createElement("p");
      p.className = "sentence";
      var parts = w.ex[0].s.split("___");
      p.appendChild(document.createTextNode(parts[0]));
      var b = document.createElement("span");
      b.className = "blank";
      b.setAttribute("aria-label", "빈칸");
      p.appendChild(b);
      p.appendChild(document.createTextNode(parts[1] || ""));
      var ko = document.createElement("p");
      ko.className = "prompt-sub";
      ko.textContent = w.ex[0].ko;
      body.appendChild(p);
      body.appendChild(ko);

      // 빈칸 문제는 고르지 않고 직접 타이핑해서 외운다
      var fillWrap = document.createElement("div");
      fillWrap.className = "fill-wrap";

      var input = document.createElement("input");
      input.type = "text";
      input.id = "fill-input";
      input.className = "fill-input";
      input.setAttribute("autocomplete", "off");
      input.setAttribute("autocapitalize", "off");
      input.setAttribute("autocorrect", "off");
      input.spellcheck = false;
      input.placeholder = "빈칸에 들어갈 단어";
      input.setAttribute("aria-label", "빈칸에 들어갈 영어 단어 입력");
      input.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") { submitTyped(); }
      });

      var submitBtn = document.createElement("button");
      submitBtn.type = "button";
      submitBtn.id = "fill-submit";
      submitBtn.className = "fill-submit";
      submitBtn.textContent = "확인";
      submitBtn.addEventListener("click", submitTyped);

      fillWrap.appendChild(input);
      fillWrap.appendChild(submitBtn);
      body.appendChild(fillWrap);
      input.focus();
    }

    if (current.type === "meaning") {
      current.options.forEach(function (opt) {
        var btn = document.createElement("button");
        btn.className = "choice";
        btn.type = "button";
        btn.textContent = opt.ko;
        btn.addEventListener("click", function () { answer(opt, btn); });
        choices.appendChild(btn);
      });
    }
  }

  function answer(opt, btn) {
    var w = current.word;
    var correct = (opt.en === w.en);
    var all = $("q-choices").querySelectorAll(".choice");

    for (var i = 0; i < all.length; i++) { all[i].disabled = true; }
    btn.classList.add(correct ? "right" : "wrong");

    if (!correct) {
      for (var j = 0; j < all.length; j++) {
        if (all[j].textContent === w.ko) { all[j].classList.add("right"); }
      }
    }

    grade(w, correct);
  }

  // 빈칸 문제: 고르지 않고 직접 쓴 철자를 채점한다
  function submitTyped() {
    var input = $("fill-input");
    var submitBtn = $("fill-submit");
    if (!input || input.disabled) { return; }

    var typed = input.value.trim();
    if (!typed) { input.focus(); return; }

    var w = current.word;
    var correct = typed.toLowerCase() === w.en.toLowerCase();

    input.disabled = true;
    submitBtn.disabled = true;
    input.classList.add(correct ? "right" : "wrong");

    grade(w, correct);
  }

  function grade(w, correct) {
    S.asked += 1;
    S.qNo += 1;
    rollDay(S);
    S.daily.done += 1;

    var v = $("q-verdict");
    v.className = "verdict " + (correct ? "ok" : "no");

    if (correct) {
      S.correct += 1;
      if (S.wrong[w.en]) { delete S.wrong[w.en]; }
      S.levels[w.en] = Math.min(MAX_LEVEL, levelOf(w.en) + 1);
      v.innerHTML = "<span>잘했어! 맞힌 개수 " + S.correct + "개</span>" +
                    "<small>" + esc(w.en) + " = " + esc(w.ko) +
                    " · 외운 단계 " + S.levels[w.en] + "/" + MAX_LEVEL + "</small>";
    } else {
      S.wrong[w.en] = (S.wrong[w.en] || 0) + 1;
      S.levels[w.en] = 1;   // 틀리면 처음부터 다시
      v.innerHTML = "<span>아쉬워! 정답은 <b>" + esc(current.type === "meaning" ? w.ko : w.en) + "</b></span>" +
                    "<small>" + esc(w.en) + " = " + esc(w.ko) + " · 내 단어장에 넣어 뒀어</small>";
    }

    S.due[w.en] = S.qNo + GAP[S.levels[w.en]];

    // 오늘 목표를 채운 순간에만 연속 일수를 올린다 (하루에 한 번)
    if (S.daily.done >= S.daily.goal && S.streak.last !== S.daily.date) {
      S.streak.count = (S.streak.last === yesterdayOf(S.daily.date)) ? S.streak.count + 1 : 1;
      S.streak.last = S.daily.date;
      $("goal-done").classList.remove("hidden");
    }

    // 답을 낸 뒤에는 어느 유형이든 발음을 들려준다 (빈칸 문제는 미리 들려주면 답이 새니까 여기서만)
    var vSay = sayButton(w.en);
    if (vSay) {
      var vRow = document.createElement("div");
      vRow.className = "say-row left";
      var lab = document.createElement("span");
      lab.className = "say-label";
      lab.textContent = "발음 듣기";
      vRow.appendChild(vSay);
      vRow.appendChild(lab);
      v.appendChild(vRow);
    }

    // 맨 위 단어도 아래 목록 단어와 똑같이 철자 연습·뜻 맞히기·예문 연습을 붙인다.
    // 문제를 풀기 전에 보여주면 빈칸 문제의 답이 새므로 답한 뒤에만 나온다.
    var qd = $("q-drills");
    qd.innerHTML = "";
    qd.appendChild(buildSpellDrill(w));
    qd.appendChild(buildMeaningQuiz(w));
    w.ex.forEach(function (ex, n) { qd.appendChild(buildDrill(w, ex, n + 1)); });

    $("btn-next").classList.remove("hidden");
    $("btn-next").focus();
    save();
    renderStatus();
    renderBook();
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  /* ---------- 상태 / 카드 ---------- */
  function renderStatus() {
    rollDay(S);
    var done = Math.min(S.daily.done, S.daily.goal);

    // 맞힌 개수는 화면에서 뺐다 (제니 8/27: "중요하지 않아"). 기록 자체는 S.correct 에 그대로 쌓인다.
    $("chip-score").textContent = "푼 문제 " + S.asked;
    $("chip-streak").textContent = "🔥 " + S.streak.count + "일 연속";
    $("goal-bar").style.width = (done / S.daily.goal) * 100 + "%";
    $("goal-note").textContent = "오늘 " + S.daily.done + " / " + S.daily.goal + "문제";
    $("goal-done").classList.toggle("hidden", S.daily.done < S.daily.goal);
    $("book-count").textContent = Object.keys(S.wrong).length;
  }

  /* ---------- 말한 걸 알아듣고 채점하기 ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var canListen = !!SR;

  function normalizeSpeech(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9' ]/g, " ").replace(/\s+/g, " ").trim();
  }
  // 목표 문장의 단어 중 몇 개를 말했는지 (0~1). 순서가 조금 틀려도 인정한다.
  function scoreSpeech(said, target) {
    var a = normalizeSpeech(said).split(" ").filter(Boolean);
    var b = normalizeSpeech(target).split(" ").filter(Boolean);
    if (!b.length) { return 0; }
    var pool = a.slice(), hit = 0;
    b.forEach(function (word) {
      var i = pool.indexOf(word);
      if (i !== -1) { pool.splice(i, 1); hit += 1; }
    });
    return hit / b.length;
  }

  function makeListener(target) {
    if (!canListen) { return null; }

    var wrap = document.createElement("div");
    wrap.className = "rec-wrap";

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "rec-btn listen";
    btn.textContent = "🗣 말해보기";
    btn.setAttribute("aria-label", target + " 소리 내어 말하고 채점받기");

    var msg = document.createElement("span");
    msg.className = "rec-msg";

    var running = false;

    btn.addEventListener("click", function () {
      if (running) { return; }
      var rec;
      try { rec = new SR(); } catch (e) { msg.textContent = "이 기기에서는 안 돼요."; return; }

      rec.lang = "en-US";
      rec.interimResults = false;
      rec.maxAlternatives = 3;

      rec.onresult = function (ev) {
        var best = 0, heard = "";
        var alts = ev.results && ev.results[0] ? ev.results[0] : [];
        for (var i = 0; i < alts.length; i++) {
          var t = alts[i].transcript || "";
          var sc = scoreSpeech(t, target);
          if (sc >= best) { best = sc; heard = t; }
        }
        if (best >= 0.9) {
          msg.textContent = "딩동댕! 잘 말했어요 🎉";
          msg.className = "rec-msg good";
        } else if (best >= 0.6) {
          msg.textContent = "거의 다 됐어요! 들린 말: " + heard;
          msg.className = "rec-msg soso";
        } else {
          msg.textContent = "다시 해 볼까요? 들린 말: " + (heard || "(못 들었어요)");
          msg.className = "rec-msg";
        }
      };
      rec.onerror = function (ev) {
        var err = ev && ev.error;
        if (err === "not-allowed" || err === "service-not-allowed") {
          msg.textContent = "마이크를 못 써요. 마이크 사용을 허용해 주세요.";
        } else if (err === "no-speech") {
          msg.textContent = "소리가 안 들렸어요. 다시 말해 볼까요?";
        } else {
          msg.textContent = "잘 못 알아들었어요. 다시 해 볼까요?";
        }
        msg.className = "rec-msg";
      };
      rec.onend = function () {
        running = false;
        btn.textContent = "🗣 말해보기";
        btn.classList.remove("on");
      };

      try {
        if (synth) { synth.cancel(); }
        rec.start();
        running = true;
        btn.textContent = "👂 듣는 중…";
        btn.classList.add("on");
        msg.textContent = "지금 말해 보세요";
        msg.className = "rec-msg";
      } catch (e) {
        running = false;
        msg.textContent = "듣기를 시작하지 못했어요.";
      }
    });

    wrap.appendChild(btn);
    wrap.appendChild(msg);
    return wrap;
  }

  /* ---------- 단어장 연습 문제 ---------- */
  // 예문 하나로 만드는 연습: 먼저 통문장을 다 보여주고,
  // 그다음 그 문장의 단어 개수만큼 한 단어씩 빼서 문제를 낸다.
  // 토큰에서 앞뒤 문장부호를 떼어 낸다 ("red." -> {lead:"", core:"red", trail:"."})
  function splitToken(tok) {
    var m = tok.match(/^([^A-Za-z0-9']*)([A-Za-z0-9'’\-]+)([^A-Za-z0-9']*)$/);
    return m ? { lead: m[1], core: m[2], trail: m[3] } : { lead: "", core: tok, trail: "" };
  }

  // 목표 단어가 문장에서 몇 번째 토큰부터 몇 개를 차지하는지
  function targetSpan(w, ex) {
    var before = ex.s.split("___")[0].trim();
    var start = before ? before.split(/\s+/).length : 0;
    return { start: start, len: w.en.split(" ").length };
  }

  // ① 점점 사라지는 문장: 1단계 전체 -> 2단계 목표 단어 -> 3단계 절반 -> 4단계 전부
  function maskStage(tokens, span, stage) {
    return tokens.map(function (tok, i) {
      var inTarget = (i >= span.start && i < span.start + span.len);
      var hide =
        (stage === 2 && inTarget) ||
        (stage === 3 && (inTarget || i % 2 === 0)) ||
        (stage === 4);
      if (!hide) { return tok; }
      var p = splitToken(tok);
      return p.lead + "____" + p.trail;
    }).join(" ");
  }

  function buildDrill(w, ex, no) {
    var full = ex.s.replace("___", w.en);
    var tokens = full.split(" ");
    var span = targetSpan(w, ex);

    var box = document.createElement("div");
    box.className = "drill";

    var head = document.createElement("div");
    head.className = "drill-head";
    head.textContent = "예문 " + no;
    box.appendChild(head);

    /* --- 탭 --- */
    var tabRow = document.createElement("div");
    tabRow.className = "mini-tabs";
    var panes = {};
    var names = [["read", "읽기"], ["blank", "빈칸"], ["speak", "말하기"], ["order", "순서"]];
    var tabBtns = {};

    names.forEach(function (pair) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "mini-tab";
      b.textContent = pair[1];
      b.setAttribute("aria-pressed", String(pair[0] === "read"));
      b.addEventListener("click", function () {
        names.forEach(function (p2) {
          tabBtns[p2[0]].setAttribute("aria-pressed", String(p2[0] === pair[0]));
          panes[p2[0]].classList.toggle("hidden", p2[0] !== pair[0]);
        });
      });
      tabBtns[pair[0]] = b;
      tabRow.appendChild(b);
    });
    box.appendChild(tabRow);

    /* --- 읽기: 점점 사라지는 문장 --- */
    var readPane = document.createElement("div");
    readPane.className = "pane";

    var stageRow = document.createElement("div");
    stageRow.className = "stage-row";

    var line = document.createElement("p");
    line.className = "drill-full";
    line.textContent = full;

    var stageBtns = [];
    [1, 2, 3, 4].forEach(function (st) {
      var sb = document.createElement("button");
      sb.type = "button";
      sb.className = "stage-btn";
      sb.textContent = st + "단계";
      sb.setAttribute("aria-pressed", String(st === 1));
      sb.addEventListener("click", function () {
        line.textContent = maskStage(tokens, span, st);
        stageBtns.forEach(function (o, k) { o.setAttribute("aria-pressed", String(k + 1 === st)); });
      });
      stageBtns.push(sb);
      stageRow.appendChild(sb);
    });

    var lineRow = document.createElement("div");
    lineRow.className = "drill-line";
    lineRow.appendChild(line);
    var saySent = sayButton(full, "small");
    if (saySent) { lineRow.appendChild(saySent); }

    var ko = document.createElement("p");
    ko.className = "drill-ko";
    ko.textContent = ex.ko;

    var tip = document.createElement("p");
    tip.className = "stage-tip";
    tip.textContent = "4단계까지 가면 안 보고 말할 수 있어요";

    readPane.appendChild(stageRow);
    readPane.appendChild(lineRow);
    readPane.appendChild(ko);
    readPane.appendChild(tip);
    panes.read = readPane;
    box.appendChild(readPane);

    /* --- 빈칸: 한 단어씩 빼기 --- */
    var blankPane = document.createElement("div");
    blankPane.className = "pane hidden";

    var bKo = document.createElement("p");
    bKo.className = "drill-ko";
    bKo.textContent = ex.ko;
    blankPane.appendChild(bKo);

    tokens.forEach(function (tok, i) {
      var p = splitToken(tok);
      var shown = tokens.slice();
      shown[i] = p.lead + "____" + p.trail;

      var row = document.createElement("button");
      row.className = "q-row";
      row.type = "button";
      row.setAttribute("aria-label", (i + 1) + "번 문제, 눌러서 정답 보기");

      var num = document.createElement("span");
      num.className = "q-no";
      num.textContent = String(i + 1);

      var txt = document.createElement("span");
      txt.className = "q-txt";
      txt.textContent = shown.join(" ");

      var ans = document.createElement("span");
      ans.className = "q-ans";
      ans.textContent = p.core;

      row.appendChild(num);
      row.appendChild(txt);
      row.appendChild(ans);
      row.addEventListener("click", function () { row.classList.toggle("open"); });

      var qLine = document.createElement("div");
      qLine.className = "q-line";
      qLine.appendChild(row);
      var saySmall = sayButton(full, "small");
      if (saySmall) { qLine.appendChild(saySmall); }
      blankPane.appendChild(qLine);
    });
    panes.blank = blankPane;
    box.appendChild(blankPane);

    /* --- 말하기: 듣기 → 녹음 → 채점 --- */
    var speakPane = document.createElement("div");
    speakPane.className = "pane hidden";

    var sLine = document.createElement("p");
    sLine.className = "drill-full";
    sLine.textContent = full;
    var sRow = document.createElement("div");
    sRow.className = "drill-line";
    sRow.appendChild(sLine);
    var sSay = sayButton(full, "small");
    if (sSay) { sRow.appendChild(sSay); }
    speakPane.appendChild(sRow);

    var sKo = document.createElement("p");
    sKo.className = "drill-ko";
    sKo.textContent = ex.ko;
    speakPane.appendChild(sKo);

    var listener = makeListener(full);
    if (listener) { speakPane.appendChild(listener); }
    var rec = makeRecorder(full);
    if (rec) { speakPane.appendChild(rec); }
    if (!listener && !rec) {
      var noMic = document.createElement("p");
      noMic.className = "drill-ko";
      noMic.textContent = "이 기기에서는 녹음과 말하기 채점을 쓸 수 없어요.";
      speakPane.appendChild(noMic);
    }
    panes.speak = speakPane;
    box.appendChild(speakPane);

    /* --- 순서: 단어를 순서대로 눌러 문장 만들기 --- */
    var orderPane = document.createElement("div");
    orderPane.className = "pane hidden";
    orderPane.appendChild(buildOrderGame(tokens, ex.ko));
    panes.order = orderPane;
    box.appendChild(orderPane);

    return box;
  }

  // ④ 문장 만들기: 섞인 단어를 순서대로 눌러 문장을 완성한다
  function buildOrderGame(tokens, koText) {
    var wrap = document.createElement("div");
    wrap.className = "order-wrap";

    var hint = document.createElement("p");
    hint.className = "drill-ko";
    hint.textContent = koText;

    var made = document.createElement("p");
    made.className = "order-made";

    var bank = document.createElement("div");
    bank.className = "order-bank";

    var msg = document.createElement("p");
    msg.className = "rec-msg";

    var placed = [];

    function refresh() {
      made.textContent = placed.length ? placed.join(" ") : "여기에 문장이 만들어져요";
      made.classList.toggle("empty", placed.length === 0);
      if (placed.length === tokens.length) {
        var ok = placed.join(" ") === tokens.join(" ");
        msg.textContent = ok ? "딩동댕! 문장을 다 만들었어요 🎉" : "순서가 조금 달라요. 되돌리기로 고쳐 볼까요?";
        msg.className = "rec-msg " + (ok ? "good" : "soso");
      } else {
        msg.textContent = "";
        msg.className = "rec-msg";
      }
    }

    function build() {
      bank.innerHTML = "";
      var left = tokens.slice();
      placed.forEach(function (t) {
        var i = left.indexOf(t);
        if (i !== -1) { left.splice(i, 1); }
      });
      shuffle(left).forEach(function (t) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "order-chip";
        b.textContent = t;
        b.addEventListener("click", function () { placed.push(t); build(); refresh(); });
        bank.appendChild(b);
      });
    }

    var undo = document.createElement("button");
    undo.type = "button";
    undo.className = "rec-btn";
    undo.textContent = "↩️ 되돌리기";
    undo.addEventListener("click", function () {
      if (!placed.length) { return; }
      placed.pop();
      build();
      refresh();
    });

    var reset = document.createElement("button");
    reset.type = "button";
    reset.className = "rec-btn";
    reset.textContent = "🔄 처음부터";
    reset.addEventListener("click", function () { placed = []; build(); refresh(); });

    var tools = document.createElement("div");
    tools.className = "rec-wrap";
    tools.appendChild(undo);
    tools.appendChild(reset);

    wrap.appendChild(hint);
    wrap.appendChild(made);
    wrap.appendChild(bank);
    wrap.appendChild(tools);
    wrap.appendChild(msg);

    build();
    refresh();
    return wrap;
  }

  // 단어마다 붙는 철자 빈칸 연습. 한 번에 딱 한 글자만 빈칸이고 나머지는 그대로 보인다.
  // 맞히면 그 글자는 그대로 보이게 남고, 빈칸이 다음 글자로 옮겨간다 (jacket -> _acket -> j_cket -> ja_ket ...).
  function buildSpellDrill(w) {
    var box = document.createElement("div");
    box.className = "spell-box";

    var ask = document.createElement("p");
    ask.className = "spell-ask";
    ask.textContent = "빈칸 글자를 하나씩 채워 보자";

    var lettersWrap = document.createElement("div");
    lettersWrap.className = "spell-letters";

    var slots = [];       // 화면에 보이는 칸 전부 (스페이스 자리는 el 없음)
    w.en.split("").forEach(function (ch) {
      if (ch === " ") {
        var gap = document.createElement("span");
        gap.className = "spell-gap";
        lettersWrap.appendChild(gap);
        slots.push({ ch: ch, el: null, isSpace: true });
      } else {
        var slot = document.createElement("span");
        slot.className = "spell-slot";
        lettersWrap.appendChild(slot);
        slots.push({ ch: ch, el: slot, isSpace: false });
      }
    });
    var letterSlots = slots.filter(function (s) { return !s.isSpace; }); // 실제로 채워야 할 글자만

    var input = document.createElement("input");
    input.type = "text";
    input.className = "spell-hidden-input";
    input.setAttribute("autocomplete", "off");
    input.setAttribute("autocapitalize", "off");
    input.setAttribute("autocorrect", "off");
    input.spellcheck = false;
    input.setAttribute("aria-label", w.en + " 빈칸 글자 입력");

    var msg = document.createElement("p");
    msg.className = "rec-msg";

    var blankIdx = 0;   // letterSlots 중 지금 비어 있는 글자의 번호

    function render() {
      letterSlots.forEach(function (s, i) {
        if (i === blankIdx) {
          s.el.textContent = "";
          s.el.classList.add("active");
          s.el.classList.remove("filled", "done", "wrong");
        } else if (i < blankIdx) {
          s.el.textContent = s.ch;
          s.el.classList.remove("active", "wrong");
          s.el.classList.add("filled", "done");
        } else {
          s.el.textContent = s.ch;   // 아직 안 맞힌 글자도 미리 보여준다
          s.el.classList.remove("active", "wrong", "done");
          s.el.classList.add("filled");
        }
      });
    }
    function reset() {
      blankIdx = 0;
      input.value = "";
      msg.textContent = "";
      msg.className = "rec-msg";
      render();
    }
    function typeChar(ch) {
      if (blankIdx >= letterSlots.length) { return; }
      var slot = letterSlots[blankIdx];
      if (ch.toLowerCase() === slot.ch.toLowerCase()) {
        blankIdx += 1;
        render();
        if (blankIdx >= letterSlots.length) {
          msg.textContent = "다 썼어! 잘했어 🎉";
          msg.className = "rec-msg good";
        }
      } else if (ch !== " ") {
        slot.el.classList.add("wrong");
        window.setTimeout(function () { slot.el.classList.remove("wrong"); }, 300);
      }
    }

    input.addEventListener("input", function () {
      var v = input.value;
      input.value = "";
      for (var i = 0; i < v.length; i++) { typeChar(v[i]); }
    });

    // 입력창을 글자 칸 전체 위에 투명하게 겹쳐 둔다 — 어디를 눌러도 그 자리가 곧 입력창이라
    // 모바일에서도 탭하면 바로 키보드가 뜬다 (별도 focus() 위임에 기대지 않는다).
    lettersWrap.appendChild(input);

    var resetBtn = document.createElement("button");
    resetBtn.type = "button";
    resetBtn.className = "rec-btn";
    resetBtn.textContent = "🔄 다시 쓰기";
    resetBtn.addEventListener("click", reset);

    var tools = document.createElement("div");
    tools.className = "rec-wrap";
    tools.appendChild(resetBtn);
    var say = sayButton(w.en);
    if (say) { tools.appendChild(say); }

    box.appendChild(ask);
    box.appendChild(lettersWrap);
    box.appendChild(tools);
    box.appendChild(msg);

    reset();
    return box;
  }

  // 단어마다 붙는 작은 뜻 맞히기. 답하기 전에는 뜻을 숨겨 둔다.
  function buildMeaningQuiz(w) {
    var box = document.createElement("div");
    box.className = "mini-quiz";

    var ask = document.createElement("p");
    ask.className = "mini-ask";
    ask.textContent = "무슨 뜻일까?";

    var grid = document.createElement("div");
    grid.className = "mini-grid";

    var answer = document.createElement("div");
    answer.className = "word-ko hidden";
    answer.textContent = w.ko;

    var again = document.createElement("button");
    again.type = "button";
    again.className = "rec-btn hidden";
    again.textContent = "🔄 다시 풀기";

    function fill() {
      grid.innerHTML = "";
      var same = WORDS.filter(function (o) { return o.cat === w.cat && o.en !== w.en; });
      var opts = shuffle(same.slice()).slice(0, 3);
      while (opts.length < 3) {
        var extra = pick(WORDS);
        if (extra.en !== w.en && opts.indexOf(extra) === -1) { opts.push(extra); }
      }
      shuffle(opts.concat([w])).forEach(function (o) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "mini-choice";
        b.textContent = o.ko;
        b.addEventListener("click", function () {
          var all = grid.children;
          for (var i = 0; i < all.length; i++) {
            all[i].disabled = true;
            if (all[i].textContent === w.ko) { all[i].classList.add("right"); }
          }
          if (o.en !== w.en) { b.classList.add("wrong"); }
          answer.classList.remove("hidden");
          again.classList.remove("hidden");
          ask.textContent = (o.en === w.en) ? "딩동댕! 🎉" : "아쉬워! 정답은 이거야";
        });
        grid.appendChild(b);
      });
    }

    again.addEventListener("click", function () {
      ask.textContent = "무슨 뜻일까?";
      answer.classList.add("hidden");
      again.classList.add("hidden");
      fill();
    });

    fill();
    box.appendChild(ask);
    box.appendChild(grid);
    box.appendChild(answer);
    box.appendChild(again);
    return box;
  }

  /* ---------- 단어장 ---------- */
  var bookMode = "wrong";

  // 틀린 단어가 하나도 없는데 '틀린 단어' 보기를 켜 두면 화면이 텅 빈다.
  // 그럴 땐 전체 단어를 보여준다 (예문 연습은 틀리지 않아도 할 수 있어야 하니까).
  function syncBookMode() {
    if (bookMode === "wrong" && !Object.keys(S.wrong).length) { bookMode = "all"; }
    $("seg-wrong").setAttribute("aria-pressed", String(bookMode === "wrong"));
    $("seg-all").setAttribute("aria-pressed", String(bookMode === "all"));
  }

  /* ---------- 단어 찾기 ----------
     제니 지시 8/27: 원하는 단어를 찾아서 다시 연습할 수 있게.
     영어 철자, 한글 뜻, 예문(영어·한글) 어디에 걸려도 찾아준다.
     띄어쓰기는 무시하고 비교하므로 "재 킷"으로 쳐도 찾아진다. */
  var bookQuery = "";

  function normSearch(s) { return String(s == null ? "" : s).toLowerCase().replace(/\s+/g, ""); }

  // 얼마나 잘 맞는지 점수를 매긴다. 찾는 단어가 예문에 걸린 다른 단어보다
  // 항상 위에 오게 하려는 것 ("jacket"을 찾았는데 yellow가 먼저 나오면 안 되니까).
  //   3 = 영어 철자가 그것으로 시작   2 = 철자나 뜻 안에 들어 있음
  //   1 = 예문에만 나옴              0 = 못 찾음
  function matchRank(w, q) {
    var en = normSearch(w.en);
    if (en === q || en.indexOf(q) === 0) { return 3; }
    if (en.indexOf(q) !== -1 || normSearch(w.ko).indexOf(q) !== -1) { return 2; }
    var inEx = (w.ex || []).some(function (ex) {
      return normSearch(ex.s).indexOf(q) !== -1 || normSearch(ex.ko).indexOf(q) !== -1;
    });
    return inEx ? 1 : 0;
  }

  function renderBook() {
    syncBookMode();
    var keys;

    var q = normSearch(bookQuery);
    var searching = q.length > 0;
    var exOnly = {};   // 예문에만 나온 단어 — 왜 떴는지 알려주려고 표시해 둔다

    // 찾는 동안에는 맨 위 검색칸 바로 아래에 결과만 보여주고 나머지는 잠시 접는다.
    // 그래야 아래로 한참 내려가지 않고 바로 눈에 들어온다.
    $("view-search").classList.toggle("hidden", !searching);
    $("view-game").classList.toggle("hidden", searching);
    $("view-book").classList.toggle("hidden", searching);

    var list = searching ? $("search-list") : $("word-list");
    var idle = searching ? $("word-list") : $("search-list");
    if (idle) { idle.innerHTML = ""; }   // 안 보이는 쪽은 비워 둔다

    if (searching) {
      // 찾는 중에는 틀린 단어/전체 구분을 무시하고 모든 단어에서 찾는다.
      // 한 번도 틀린 적 없는 단어도 다시 연습하고 싶을 수 있으니까.
      var hits = [];
      WORDS.forEach(function (w, i) {
        var r = matchRank(w, q);
        if (r) { hits.push({ en: w.en, rank: r, i: i }); }
      });
      // 잘 맞는 것부터. 점수가 같으면 원래 순서대로.
      hits.sort(function (a, b) { return (b.rank - a.rank) || (a.i - b.i); });
      exOnly = {};
      hits.forEach(function (h) { if (h.rank === 1) { exOnly[h.en] = true; } });
      keys = hits.map(function (h) { return h.en; });
    } else if (bookMode === "all") {
      keys = WORDS.map(function (w) { return w.en; });
    } else {
      keys = Object.keys(S.wrong);
      keys.sort(function (a, b) { return S.wrong[b] - S.wrong[a]; });
    }
    list.innerHTML = "";

    var msg = $("search-msg");
    var clearBtn = $("search-clear");
    if (msg) {
      msg.textContent = searching
        ? (keys.length ? "찾은 단어 " + keys.length + "개" : "")
        : "";
    }
    if (clearBtn) { clearBtn.classList.toggle("hidden", !searching); }

    if (!keys.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = searching
        ? "그런 단어는 아직 없어요. 철자를 다시 볼까요?"
        : "아직 틀린 단어가 없어요. 멋진데!";
      list.appendChild(e);
      return;
    }

    keys.forEach(function (en, idx) {
      var w = findWord(en);
      if (!w) { return; }
      var item = document.createElement("div");
      item.className = "word-item";

      var head = document.createElement("div");
      head.className = "word-head";

      var enWrap = document.createElement("div");
      enWrap.className = "word-en-wrap";

      // 맨 위 문제 단어가 1번이므로 목록은 2번부터 이어 붙인다.
      // 찾는 중에는 목록 속 순서라는 뜻이 사라지니 번호를 빼둔다.
      if (!searching) {
        var numBadge = document.createElement("span");
        numBadge.className = "word-no";
        numBadge.textContent = (idx + 2) + ".";   // 맨 위 문제 단어가 1번
        enWrap.appendChild(numBadge);
      }

      var enText = document.createElement("span");
      enText.className = "word-en";
      enText.textContent = w.en;
      enWrap.appendChild(enText);
      var sayWord = sayButton(w.en);
      if (sayWord) { enWrap.appendChild(sayWord); }
      head.appendChild(enWrap);

      if (S.wrong[en]) {
        var miss = document.createElement("span");
        miss.className = "miss";
        miss.textContent = S.wrong[en] + "번 틀림";
        head.appendChild(miss);
      }

      // 이 단어 자체가 아니라 예문에 찾는 말이 들어 있어서 뜬 경우
      if (exOnly[en]) {
        var why = document.createElement("span");
        why.className = "why-hit";
        why.textContent = "예문에 나와요";
        head.appendChild(why);
      }

      var spell = buildSpellDrill(w);
      var ko = buildMeaningQuiz(w);

      var drills = document.createElement("div");
      drills.className = "drills";
      w.ex.forEach(function (ex, n) { drills.appendChild(buildDrill(w, ex, n + 1)); });

      item.appendChild(head);
      item.appendChild(spell);
      item.appendChild(ko);
      item.appendChild(drills);

      if (S.wrong[en]) {
        var btn = document.createElement("button");
        btn.className = "big-btn ghost";
        btn.type = "button";
        btn.textContent = "외웠어요 ✓";
        btn.addEventListener("click", function () {
          delete S.wrong[en];
          save();
          renderBook();
          renderStatus();
        });
        item.appendChild(btn);
      }
      list.appendChild(item);
    });
  }

  /* ---------- 저장 파일 내보내기 / 불러오기 ---------- */
  function setMsg(text) { $("io-msg").textContent = text || ""; }

  function exportSave() {
    var dl = window.claude && window.claude.downloads;
    if (!dl) { setMsg("이 화면에서는 파일 내보내기를 쓸 수 없어요."); return; }
    dl.save({ filename: "영어단어게임_저장.json", data: JSON.stringify(S) })
      .then(function () { setMsg("저장 파일을 내보냈어요."); })
      .catch(function (err) {
        var code = err && err.code;
        if (code === "declined") { setMsg("내보내기를 취소했어요."); }
        else if (code === "rate_limited") { setMsg("잠깐 기다렸다가 다시 눌러 주세요."); }
        else { setMsg("파일을 내보내지 못했어요."); }
      });
  }

  function importSave(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        S = normalize(JSON.parse(String(reader.result)));
        save();
        renderStatus();
        renderBook();
        nextQuestion();
        setMsg("불러왔어요! 이어서 하면 돼요.");
      } catch (e) {
        setMsg("이 파일은 읽을 수 없어요. 내보낸 저장 파일을 골라 주세요.");
      }
    };
    reader.onerror = function () { setMsg("파일을 읽지 못했어요."); };
    reader.readAsText(file);
  }

  function setBookMode(mode) {
    bookMode = mode;
    // 틀린 단어/전체를 누르면 찾던 것을 놓아준다 (안 그러면 눌러도 목록이 안 바뀌어 보인다)
    setSearch("");
    renderBook();
  }

  function setSearch(text) {
    bookQuery = text || "";
    var box = $("word-search");
    if (box && box.value !== bookQuery) { box.value = bookQuery; }
  }

  // 문제와 단어 외우기를 한 화면에 위아래로 둔다 (화면 전환 없음)

  /* ---------- 시작 ---------- */
  load();
  renderStatus();
  renderBook();
  nextQuestion();

  $("seg-wrong").addEventListener("click", function () { setBookMode("wrong"); });
  $("seg-all").addEventListener("click", function () { setBookMode("all"); });

  $("word-search").addEventListener("input", function (ev) {
    setSearch(ev.target.value);
    renderBook();
  });
  $("word-search").addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { setSearch(""); renderBook(); }
  });
  $("search-clear").addEventListener("click", function () {
    setSearch("");
    renderBook();
    $("word-search").focus();
  });
  $("btn-next").addEventListener("click", nextQuestion);
  $("btn-export").addEventListener("click", exportSave);
  $("btn-import").addEventListener("click", function () { $("file-input").click(); });
  $("file-input").addEventListener("change", function (ev) {
    if (ev.target.files && ev.target.files[0]) { importSave(ev.target.files[0]); }
    ev.target.value = "";
  });

  if (!(window.claude && window.claude.downloads)) {
    $("btn-export").classList.add("hidden");
  }
})();
</script>
</body>
</html>
